version: '3.8'

services:
  python-gpu-container-all-gpus:
    build:
      context: . # Path to the Dockerfile (current directory)
      dockerfile: Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    shm_size: '128g'
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"  # All GPUs
      CUDA_HOME: "/usr/local/cuda"
      LD_LIBRARY_PATH: "/usr/local/lib:/usr/lib:/lib:$LD_LIBRARY_PATH"
    volumes:
      - ../datasets:/data
      - ../trained_models:/trained_models
      - ../robust_training:/workspace  
    #command: python run_exp.py  # Run the main script for this container
    tty: true